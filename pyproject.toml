[project]
name = "ibank-demo"
version = "1.0.0"
description = "Read-only banking demo with FastAPI, MCP, LangGraph and React"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "PyJWT>=2.9,<3",
    "bcrypt>=4.2,<6",
    "python-dotenv>=1,<2",
    "mcp>=1.12,<2",
    "langgraph>=1,<2",
    "langchain-openai>=1,<2",
    "openai>=3,<4",
    "langchain-mcp-adapters>=0.3.2,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "httpx>=0.27,<1",
    "cryptography>=46,<51",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.fastapi.static]
cdn = true
